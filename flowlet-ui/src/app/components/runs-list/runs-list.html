<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Flow Runs</h1>
    <button class="btn btn-primary" (click)="loadRuns()">
      <i class="bi bi-arrow-clockwise"></i> Refresh
    </button>
  </div>

  <div *ngIf="loading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger" role="alert">
    {{ error }}
  </div>

  <div *ngIf="!loading && !error">
    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th>Flow Name</th>
            <th>Status</th>
            <th>Started At</th>
            <th>Finished At</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let run of runs">
            <td><strong>{{ run.flow_name }}</strong></td>
            <td>
              <span class="badge"
                    [ngClass]="{
                      'bg-success': run.status === 'completed',
                      'bg-danger': run.status === 'failed',
                      'bg-warning': run.status === 'running',
                      'bg-secondary': run.status === 'pending'
                    }">
                {{ run.status }}
              </span>
            </td>
            <td>{{ run.started_at | date:'medium' }}</td>
            <td>{{ run.finished_at ? (run.finished_at | date:'medium') : 'Running...' }}</td>
            <td>
              <a [routerLink]="['/runs', run.flow_id]" class="btn btn-sm btn-info">
                View Details
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="runs.length === 0" class="alert alert-info">
      No runs found.
    </div>
  </div>
</div>
