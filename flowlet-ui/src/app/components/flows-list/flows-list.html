<div style="padding: 24px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
    <h1>Flowlet Workflows</h1>
    <button mat-raised-button color="primary" (click)="loadFlows()">
      <mat-icon>refresh</mat-icon> Refresh
    </button>
  </div>

  <div *ngIf="loading" style="display: flex; justify-content: center; padding: 40px;">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="error" style="color: #f44336; padding: 16px; background-color: #ffebee; border-radius: 4px; margin-bottom: 16px;">
    {{ error }}
  </div>

  <div *ngIf="!loading && !error">
    <table mat-table [dataSource]="flows" class="mat-elevation-z2" style="width: 100%;">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Flow Name</th>
        <td mat-cell *matCellDef="let flow"><strong>{{ flow.name }}</strong></td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Last Status</th>
        <td mat-cell *matCellDef="let flow">
          <mat-chip [color]="getStatusColor(flow.status)">
            {{ flow.status || 'N/A' }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="finished">
        <th mat-header-cell *matHeaderCellDef>Finished</th>
        <td mat-cell *matCellDef="let flow">{{ flow.finished_ago }}</td>
      </ng-container>

      <ng-container matColumnDef="duration">
        <th mat-header-cell *matHeaderCellDef>Duration</th>
        <td mat-cell *matCellDef="let flow">{{ flow.duration }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let flow">{{ flow.doc || 'N/A' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let flow">
          <button mat-raised-button color="primary" (click)="runFlow(flow.name)">
            Run
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <div *ngIf="flows.length === 0" style="padding: 16px; background-color: #e3f2fd; color: #1976d2; border-radius: 4px; margin-top: 16px;">
      No flows available.
    </div>
  </div>
</div>
