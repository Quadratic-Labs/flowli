<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Flowlet Workflows</h1>
    <button class="btn btn-primary" (click)="loadFlows()">
      <i class="bi bi-arrow-clockwise"></i> Refresh
    </button>
  </div>

  <div *ngIf="loading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger" role="alert">
    {{ error }}
  </div>

  <div *ngIf="!loading && !error">
    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th>Flow Name</th>
            <th>Last Status</th>
            <th>Finished</th>
            <th>Duration</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let flow of flows">
            <td>
              <strong>{{ flow.name }}</strong>
            </td>
            <td>
              <span class="badge"
                    [ngClass]="{
                      'bg-success': flow.last_status === 'completed',
                      'bg-danger': flow.last_status === 'failed',
                      'bg-warning': flow.last_status === 'running',
                      'bg-secondary': flow.last_status === 'pending'
                    }">
                {{ flow.last_status }}
              </span>
            </td>
            <td>{{ flow.finished_ago }}</td>
            <td>{{ flow.duration }}</td>
            <td>{{ flow.doc || 'N/A' }}</td>
            <td>
              <button class="btn btn-sm btn-primary me-2" (click)="runFlow(flow.name)">
                Run
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="flows.length === 0" class="alert alert-info">
      No flows available.
    </div>
  </div>
</div>
