[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowlet-example"
version = "0.1.0"
description = "Example application demonstrating Flowlet framework usage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Flowlet Team" }
]

dependencies = [
    "flowlet>=0.1.0",
    "uvicorn[standard]>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowlet_example"]
