[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowlet-codeflow"
version = "0.1.0"
description = "The CodeFlow controller: plan, routing, merge queue and board"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = ["flowlet", "flowlet-runner"]

[project.optional-dependencies]
cli = ["flowlet[cli]", "typer>=0.9.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.2.0", "mypy>=1.8.0"]

[project.scripts]
flowlet-codeflow = "flowlet_codeflow.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flowlet_codeflow" = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.14"

[[tool.mypy.overrides]]
module = ["cairndb", "cairndb.*"]
ignore_missing_imports = true
follow_untyped_imports = true
