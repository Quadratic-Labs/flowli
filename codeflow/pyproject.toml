[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowli-codeflow"
version = "0.1.0"
description = "The CodeFlow controller: plan, routing, merge queue and board"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["flowli", "flowli-runner"]

[project.optional-dependencies]
cli = ["flowli[cli]", "typer>=0.9.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.2.0", "mypy>=1.8.0"]

[project.scripts]
flowli-codeflow = "flowli_codeflow.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flowli_codeflow" = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
# Code blocks in the docs and specs are aligned by hand.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.14"
