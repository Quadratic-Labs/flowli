[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskflow"
version = "0.1.0"
description = "Prefect-like task orchestration — the flow-run controller over the Flowlet account kernel"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "attrs>=25.4.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "flowlet @ git+ssh://git@github.com/Quadratic-Labs/flowlet.git",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0", "fastapi>=0.104.0"]

[project.scripts]
taskflow = "taskflow.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/taskflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
