<h2>Runs for flow: {{ flow_name }}</h2>
<table class="runs">
  <tr><th>ID</th><th>Status</th><th>Started</th><th>Finished</th></tr>
  {% for run in runs %}
  <tr class="status-{{ run.status }}">
    <td>
      <a hx-get="/ui/runs/{{ run.id }}/tasks" hx-target="#content" hx-swap="innerHTML">
        {{ run.id[:8] }}...
      </a>
    </td>
    <td>{{ run.status }}</td>
    <td>{{ run.started_at.strftime('%H:%M:%S') }}</td>
    <td>{{ run.finished_at.strftime('%H:%M:%S') if run.finished_at else '' }}</td>
  </tr>
  {% endfor %}
</table>
