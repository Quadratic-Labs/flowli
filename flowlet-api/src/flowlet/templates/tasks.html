<h3>Tasks for run {{ run_id }}</h3>
<table class="tasks">
  <tr><th>Task</th><th>Status</th><th>Start</th><th>End</th><th>Result</th></tr>
  {% for t in tasks %}
  <tr class="status-{{ t.status }}">
    <td>{{ t.task_name }}</td>
    <td>{{ t.status }}</td>
    <td>{{ t.started_at.strftime('%H:%M:%S') }}</td>
    <td>{{ t.finished_at.strftime('%H:%M:%S') if t.finished_at else '' }}</td>
    <td class="result">{{ t.result or t.error }}</td>
  </tr>
  {% endfor %}
</table>
