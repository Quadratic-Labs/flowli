version: '3'

vars:
  API_PORT: 8001

tasks:
  install:
    desc: Install flowlet, taskflow, taskflow-example (editable) and the dashboard's npm deps
    cmds:
      - .venv/bin/pip install -e flowlet-api
      - .venv/bin/pip install -e taskflow --no-deps
      - .venv/bin/pip install -e taskflow-example --no-deps
      - npm install --prefix flowlet-web

  api:
    desc: Run the example API + embedded in-memory worker (single-process demo, port 8001)
    dir: taskflow-example
    cmds:
      - ../.venv/bin/uvicorn taskflow_example.main:app --reload --port {{.API_PORT}}

  web:
    desc: Run the dashboard dev server (proxies /api to localhost:8001)
    cmds:
      - npm run dev --prefix flowlet-web

  demo:
    desc: Run the API+worker and the dashboard together (Ctrl-C stops both)
    deps: [api, web]

  flows:
    desc: List registered flows
    cmds:
      - curl -s http://localhost:{{.API_PORT}}/flows | python3 -m json.tool

  submit:
    desc: 'Submit a flow for async execution. Usage: task submit FLOW=hello_world KWARGS=''{"name":"Taskflow"}'''
    vars:
      FLOW: '{{.FLOW | default "hello_world"}}'
      KWARGS: '{{.KWARGS | default "{}"}}'
    cmds:
      - |
        curl -s -X POST http://localhost:{{.API_PORT}}/submit/{{.FLOW}} \
          -H "Content-Type: application/json" \
          -d "{\"kwargs\": {{.KWARGS}}}" | python3 -m json.tool

  obligations:
    desc: List the most recent obligation summaries
    cmds:
      - |
        curl -s -X POST http://localhost:{{.API_PORT}}/obligations/query \
          -H "Content-Type: application/json" -d '{"last_n": 10}' | python3 -m json.tool

  worker:
    desc: Run a standalone worker process (see README's multi-process caveat re in-memory queue)
    cmds:
      - .venv/bin/taskflow work --app taskflow_example.flows:tf

  sweep:
    desc: Run one sweep pass (crash recovery / archival of closed obligations)
    cmds:
      - .venv/bin/flowlet sweep --app taskflow_example.flows:tf

  test:
    desc: Run the flowlet-api and taskflow test suites
    cmds:
      - .venv/bin/pytest flowlet-api/tests
      - .venv/bin/pytest taskflow/tests
